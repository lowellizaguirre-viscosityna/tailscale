[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailtray"
version = "0.1.0"
description = "A small Linux tray controller for Tailscale"
requires-python = ">=3.10"

[project.scripts]
tailtray = "tailtray.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
